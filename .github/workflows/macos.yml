name: macOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos.yml'
      - 'packaging/**'
      - 'wxfilehelper/**'
      - 'scripts/**'
      - 'requirements*.txt'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WXFileHelper-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
