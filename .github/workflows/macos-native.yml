name: Build native macOS 1.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/macos-native.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build, launch, and verify signed bundle and disk image
        run: bash native/packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
